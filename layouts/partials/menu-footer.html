<script async defer src="https://buttons.github.io/buttons.js"></script>

<!-- Tự động giữ nguyên vị trí cuộn của Sidebar khi chuyển trang -->
<script>
    (function() {
        function restoreSidebarScroll() {
            var sidebar = document.querySelector("#sidebar .highlightable");
            if (!sidebar) return;
            var savedPos = sessionStorage.getItem("sidebar-scroll-pos");
            if (savedPos !== null) {
                sidebar.scrollTop = parseInt(savedPos, 10);
                if (window.jQuery && jQuery.fn.perfectScrollbar) {
                    jQuery(sidebar).perfectScrollbar('update');
                }
            } else {
                var activeItem = sidebar.querySelector("li.active");
                if (activeItem) {
                    var containerRect = sidebar.getBoundingClientRect();
                    var activeRect = activeItem.getBoundingClientRect();
                    var relTop = activeRect.top - containerRect.top;
                    sidebar.scrollTop = sidebar.scrollTop + relTop - (containerRect.height / 2);
                    if (window.jQuery && jQuery.fn.perfectScrollbar) {
                        jQuery(sidebar).perfectScrollbar('update');
                    }
                }
            }
        }

        function bindEvents() {
            var sidebar = document.querySelector("#sidebar .highlightable");
            if (!sidebar) return;

            sidebar.addEventListener("scroll", function() {
                sessionStorage.setItem("sidebar-scroll-pos", sidebar.scrollTop);
            });

            var links = sidebar.querySelectorAll("a");
            for (var i = 0; i < links.length; i++) {
                links[i].addEventListener("click", function() {
                    sessionStorage.setItem("sidebar-scroll-pos", sidebar.scrollTop);
                });
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", function() {
                bindEvents();
                restoreSidebarScroll();
            });
        } else {
            bindEvents();
            restoreSidebarScroll();
        }

        window.addEventListener("load", function() {
            restoreSidebarScroll();
        });

        // Chạy lại sau khi perfectScrollbar khởi tạo xong
        setTimeout(restoreSidebarScroll, 100);
        setTimeout(restoreSidebarScroll, 300);
        setTimeout(restoreSidebarScroll, 600);
    })();
</script>
