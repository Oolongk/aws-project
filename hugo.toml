baseURL = 'https://Oolongk.github.io/aws-project/'
defaultContentLanguage = 'vi'
theme = 'learn'

[outputs]
home = [ "HTML", "RSS", "JSON"]

[params]
  themeVariant = 'workshop'
  showVisitedLinks = true
  disableSearch = false
  disableLanguageSwitching = false
  custom_css = ["css/custom.css"]

[languages]
  [languages.vi]
    contentDir = 'content/vi'
    title = 'AWS FCJ Capstone Report - Nguyễn Ngọc Tuấn Khanh'
    weight = 1
    label = 'Tiếng Việt'

  [languages.en]
    contentDir = 'content/en'
    title = 'AWS FCJ Capstone Report - Nguyen Ngoc Tuan Khanh'
    weight = 2
    label = 'English'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true